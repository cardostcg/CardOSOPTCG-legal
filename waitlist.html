<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>CardOS — One Piece TCG Portfolio Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/bg-vault.webp" type="image/webp" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: #0A0E1A;
    }

    .bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 38%;
      pointer-events: none;
    }

    .bg-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 42%, rgba(10, 14, 26, 0.55), rgba(10, 14, 26, 0.2) 60%, rgba(10, 14, 26, 0.65));
    }

    body {
      background: #0A0E1A;
      color: #E8EAF0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(55, 138, 221, 0.15);
      border: 1px solid rgba(55, 138, 221, 0.4);
      color: #378ADD;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      max-width: 580px;
      margin-bottom: 16px;
    }

    h1 span { color: #5DCAA5; }

    p {
      font-size: clamp(15px, 2.5vw, 18px);
      color: #8A8FA8;
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .signup {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 460px;
    }

    .signup input {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #E8EAF0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(138, 143, 168, 0.45);
      border-radius: 12px;
      padding: 13px 16px;
      flex: 1 1 220px;
      min-width: 0;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .signup input::placeholder { color: #5A5F78; }

    .signup input:hover { border-color: rgba(138, 143, 168, 0.7); }

    .signup input:focus-visible {
      outline: 2px solid #5DCAA5;
      outline-offset: 2px;
    }

    .cta {
      display: inline-block;
      background: #378ADD;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .cta:hover { background: #2a6bb5; }
    .cta:active { transform: scale(0.97); }

    .cta:focus-visible {
      outline: 2px solid #5DCAA5;
      outline-offset: 3px;
    }

    .form-note {
      font-size: 14px;
      color: #5DCAA5;
      margin-top: 18px;
      margin-bottom: 0;
      min-height: 1.5em;
    }

    .hidden-submit { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .cta, .signup input { transition: none; }
      .cta:active { transform: none; }
    }

    footer {
      position: fixed;
      bottom: 20px;
      font-size: 12px;
      color: #4A4F66;
    }

    footer a { color: #4A4F66; text-decoration: underline; }
    footer a:hover { color: #8A8FA8; }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true">
    <picture>
      <source srcset="/bg-vault.webp" type="image/webp" />
      <img src="/bg-vault.jpg" alt="" decoding="async" />
    </picture>
    <div class="bg-scrim"></div>
  </div>

  <div class="badge">Product Updates</div>

  <h1>CardOS <span>updates,</span><br />in your inbox.</h1>

  <p>Occasional product updates and One Piece TCG market insights. No spam, unsubscribe anytime.</p>

  <form class="signup" id="signup-form" action="https://docs.google.com/forms/d/e/1FAIpQLScsxzGSr8nC3G-xw27x7XSBlrvu7MYDN0WRC3O-wdFH8vyCUA/formResponse" method="POST" target="hidden-submit">
    <input type="email" name="entry.483077468" placeholder="you@example.com" required autocomplete="email" inputmode="email" aria-label="Email address" />
    <button class="cta" type="submit">Join the mailing list</button>
  </form>
  <iframe class="hidden-submit" id="hidden-submit" name="hidden-submit" title="Signup submission" aria-hidden="true" tabindex="-1"></iframe>
  <p class="form-note" id="form-note" role="status"></p>

  <footer>
    <a href="https://cardostcg.com/privacy-policy.html">Privacy Policy</a>
    &nbsp;·&nbsp;
    <a href="https://cardostcg.com/terms-of-service.html">Terms of Service</a>
  </footer>

  <script>
    (function () {
      var form = document.getElementById("signup-form");
      var frame = document.getElementById("hidden-submit");
      var note = document.getElementById("form-note");
      var submitted = false;
      form.addEventListener("submit", function () { submitted = true; });
      frame.addEventListener("load", function () {
        if (!submitted) return;
        form.style.display = "none";
        note.textContent = "You're on the list. First update lands with the next release.";
      });
    })();
  </script>

</body>
</html>
